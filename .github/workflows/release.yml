name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag must match VERSION in aisha_core.py
        run: |
          version="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' aisha_core.py)"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $version"
            exit 1
          fi

      - name: Install shellcheck and bats
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats

      - name: Lint
        run: make check

      - name: Test
        run: make test

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "aisha ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            aisha.sh aisha_core.py install.sh
